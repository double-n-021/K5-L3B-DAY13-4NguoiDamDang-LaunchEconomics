# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,80; ICC 0,02)
#   a) Chia theo yêu cầu (+5 điểm): 1.251 yêu cầu mỗi nhóm (statsmodels cho 1.250).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48 -> cần 3.103 yc/nhóm -> 42 người/nhóm (tổng 84 > 40 nhân viên: không đủ người).
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 (< 1.251: không bao giờ đạt +5 điểm dù m lớn).
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 6 / 0,02 = 300 (< 1.251 và chỉ có 6 cụm < 20 cụm/nhóm: loại).
#   e) Mức chênh 6 điểm (n = 859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần m >= 299 yêu cầu mỗi nhân viên (DE = 6,96; n_eff = 859,2).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên: 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có — 20 nhân viên nhóm đối chứng xử lý song song trong cùng tuần và cùng các depot với 20 nhân viên nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên — phân tầng theo depot rồi bốc thăm bằng code với random seed cố định trước ngày chạy (không cho nhân viên tự xung phong).
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot trao đổi cách trả lời; giảm bằng phân quyền công cụ theo tài khoản đăng nhập (staff_id) và ghi log mọi lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có — cố định trước trong file này trước ngày khởi động và không nhìn chỉ số chính giữa chừng để dừng sớm.
#   5. Ít nhất 20 cụm mỗi nhóm: Có — đúng 20 nhân viên (20 cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (vì 40 nhân viên không đạt trần 1.251 cho +5 điểm):
#   Chọn chia theo nhân viên (20 + 20) và nâng MDE lên +6 điểm (m >= 299 yc/người, n_eff = 859, power = 0,80 ở +6 điểm).
#   Nếu tác động thật chỉ là +5 điểm tại n = 859, power giảm còn 0,64 (36% rủi ro bỏ sót tác động thật); Giám đốc vận hành phải ký chấp nhận đánh đổi này trước khi chạy.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại trong mẫu chạy thử là 4,25% (51/1.200 toàn mẫu) và 3,97% (39/982 trong phạm vi noi_dia + hang_nang).
#   Vì vậy không đặt ngưỡng dừng tuyệt đối 2%-3% (sẽ dừng nhầm ngay tuần đầu), mà đặt ngưỡng tương đối: cao hơn nhóm đối chứng >= 2 điểm phần trăm HOẶC vượt trần 6,0% HOẶC >= 1 ca hoàn trùng.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ áp dụng cho noi_dia (2.696 đ = 0,22x, simulated) và hang_nang (8.221 đ = 0,69x, simulated) trên 12 depot; loại quoc_te (22.515 đ = 1,88x, thành công 27,3%) và doi_tac (10.215 đ = 0,85x, có điều khoản riêng)."
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]   # 4 -> 10 -> 20 nhân viên can thiệp (mỗi bước 1 tuần); bước 0.10 xem lại 100%, giảm dần ở bước 0.25; đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên nhóm đối chứng xử lý yêu cầu song song trong cùng tuần và cùng phân bố depot với 20 nhân viên nhóm trợ lý."
    spillover_risk: "Trung bình: nhân viên cùng depot có thể học cách trả lời; giảm thiểu bằng khóa quyền truy cập trợ lý theo staff_id và ghi log mọi lượt gọi qua trace_id."
    predeclared: "Có: chỉ số chính, MDE = 0,06, alpha = 0,05, power = 0,80, 3 luật dừng và ngày quyết định 2027-01-05 được chốt trước khi bật pilot."
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng >= 2 điểm phần trăm hoặc vượt trần 6,0%, hoặc phát sinh >= 1 ca hoàn tiền trùng lặp TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt feature flag trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ hoặc tỉ lệ ca làm lại vượt 7% TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng sang hang_nang hay bước rollout tiếp theo"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% TRONG 1 tuần ở bước 0.10 hoặc 0.25 THÌ Trưởng nhóm CSKH dừng mở rộng và phỏng vấn tối thiểu 5 nhân viên trong 3 ngày để tìm nguyên nhân KHÔNG THÌ không được nâng tỉ lệ rollout lên bước kế tiếp"
  interim_looks: "Chỉ kiểm tra chỉ số an toàn (mở lại 7 ngày, hoàn tiền trùng) và tỉ lệ xem lại/bỏ qua gợi ý theo ngày/tuần; tuyệt đối không kiểm định hay dừng sớm theo chỉ số chính trước ngày quyết định."
  rollback: "Giám đốc vận hành tắt feature flag trên cổng cấu hình, hiệu lực trong vòng 30 phút; toàn bộ yêu cầu hoàn phí tự động quay về luồng nhân viên CSKH tự xử lý như nhóm đối chứng."
  decision_date: "2027-01-05"
  simulated_inputs:
